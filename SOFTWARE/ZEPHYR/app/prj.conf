# --- M1: UI frame — input service, zbus, screen stack, home + settings ---

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Shell over the USB-Serial-JTAG console (UART0 pins are taken by SD-SPI)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y

# Cross-module IPC
CONFIG_ZBUS=y

# Display + LVGL (ST7567 over I2C, 1-bit)
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_THREAD_NAME=y
